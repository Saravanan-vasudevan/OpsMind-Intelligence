server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy: the browser only talks to this host, so the session cookie is first-party.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
  location /health/ { proxy_pass http://backend:8080; }
  location /swagger { proxy_pass http://backend:8080; }
  location /openapi/ { proxy_pass http://backend:8080; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
